name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install exact package manager and dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "process.versions.node.split('.')[0]")" = '24'
          package_manager="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).packageManager")"
          npm install --global "$package_manager"
          pnpm install --frozen-lockfile

      - name: Validate foundation
        shell: bash
        run: |
          set -euo pipefail
          pnpm validate
          git diff --check
