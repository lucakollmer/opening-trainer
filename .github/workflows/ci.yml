name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected_sha"

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install exact package manager and dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "process.versions.node.split('.')[0]")" = '24'
          package_manager="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).packageManager")"
          npm install --global "$package_manager"
          pnpm install --frozen-lockfile

      - name: Validate foundation
        shell: bash
        run: |
          set -euo pipefail
          pnpm validate
          git diff --check

      - name: Run production browser smoke
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"

          evidence_dir="${RUNNER_TEMP}/opening-trainer-browser-smoke"
          mkdir -p "$evidence_dir"

          pnpm preview --host 127.0.0.1 --port 4173 > "$evidence_dir/preview.log" 2>&1 &
          preview_pid=$!
          cleanup() {
            kill "$preview_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null

          for viewport in desktop:1440,1000 tablet:900,900 phone:390,844; do
            label="${viewport%%:*}"
            size="${viewport#*:}"
            profile="$evidence_dir/profile-$label"
            dom="$evidence_dir/dom-$label.html"
            browser_log="$evidence_dir/browser-$label.log"
            screenshot="$evidence_dir/screenshot-$label.png"

            "$browser" \
              --headless=new \
              --no-sandbox \
              --disable-dev-shm-usage \
              --disable-gpu \
              --enable-logging=stderr \
              --log-level=0 \
              --virtual-time-budget=5000 \
              --window-size="$size" \
              --user-data-dir="$profile" \
              --dump-dom \
              http://127.0.0.1:4173/ > "$dom" 2> "$browser_log"

            "$browser" \
              --headless=new \
              --no-sandbox \
              --disable-dev-shm-usage \
              --disable-gpu \
              --virtual-time-budget=5000 \
              --window-size="$size" \
              --user-data-dir="$profile" \
              --screenshot="$screenshot" \
              http://127.0.0.1:4173/ >/dev/null 2>> "$browser_log"

            test -s "$screenshot"
            grep -Fq 'Opening Trainer' "$dom"
            grep -Fq 'Training board' "$dom"

            if grep -Fq 'Opening Trainer could not start.' "$dom"; then
              cat "$dom"
              cat "$browser_log"
              exit 1
            fi

            if grep -Eq 'Minified React error|Opening Trainer failed to render|Uncaught|TypeError|ReferenceError' "$browser_log"; then
              cat "$browser_log"
              exit 1
            fi

            rm -rf "$profile"
          done

      - name: Upload browser smoke evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: browser-smoke-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/opening-trainer-browser-smoke
          if-no-files-found: warn
          retention-days: 14
