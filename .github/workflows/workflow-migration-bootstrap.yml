name: Apply workflow migration

on:
  push:
    branches:
      - phase-0-foundation
    paths:
      - .github/workflows/workflow-migration-bootstrap.yml
      - .github/bootstrap/migration-overlay.part-00
      - .github/bootstrap/migration-overlay.part-01
      - .github/bootstrap/migration-overlay.part-02
      - .github/bootstrap/migration-overlay.part-03
      - .github/bootstrap/migration-overlay.part-04
      - .github/bootstrap/migration-overlay.part-05
      - .github/bootstrap/migration-overlay.part-06

permissions:
  contents: write

concurrency:
  group: opening-trainer-workflow-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.repository == 'lucakollmer/opening-trainer' && github.ref == 'refs/heads/phase-0-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact bootstrap commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Apply, validate and commit bounded migration
        shell: bash
        run: |
          set -euo pipefail

          expected_parent='5477419fce1f13f4265ab82d6ee3058d851b5019'
          expected_overlay_sha='28f7e548c03a2f5126a736e81b94d05f7337ecaee19a96e610d2af3cfdcf63ad'
          expected_part_00_sha='a0c059e386b1169207f06f993bb6b1164ccc1e0deb1f2e6966a29c2000d4aedd'
          expected_part_01_sha='cadfd62f110497f879fd0876b89664c21e5bac2608c007325d48b0cc27c7bdc5'
          expected_part_02_sha='23cb79049e07b757723f1ee12c0aa4e6d3ff79f6bfe531b931380ce00aa5f498'
          expected_part_03_sha='bbc8a82eba191f1643130aa368929a2b95eb14975f10e79f4aeb8fbd804ee7a6'
          expected_part_04_sha='f22aa13c3304dd0f8ee37097d9df7a78ff572e275e1a90d17fb321fe58e6c8ed'
          expected_part_05_sha='347caad107621e6fd1a005d01f2bbc05cbb4dd5b98f377ba340792f84eef030d'
          expected_part_06_sha='713630d84d004cc19a8b320a2e44de2fb2fdc5820c66edd13dd9b3a329305064'
          archive='/tmp/opening-trainer-migration-overlay.tar.xz'

          test "$GITHUB_REPOSITORY" = 'lucakollmer/opening-trainer'
          test "$GITHUB_REF_NAME" = 'phase-0-foundation'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          test "$(sha256sum .github/bootstrap/migration-overlay.part-00 | cut -d' ' -f1)" = "$expected_part_00_sha"
          test "$(sha256sum .github/bootstrap/migration-overlay.part-01 | cut -d' ' -f1)" = "$expected_part_01_sha"
          test "$(sha256sum .github/bootstrap/migration-overlay.part-02 | cut -d' ' -f1)" = "$expected_part_02_sha"
          test "$(sha256sum .github/bootstrap/migration-overlay.part-03 | cut -d' ' -f1)" = "$expected_part_03_sha"
          test "$(sha256sum .github/bootstrap/migration-overlay.part-04 | cut -d' ' -f1)" = "$expected_part_04_sha"
          test "$(sha256sum .github/bootstrap/migration-overlay.part-05 | cut -d' ' -f1)" = "$expected_part_05_sha"
          test "$(sha256sum .github/bootstrap/migration-overlay.part-06 | cut -d' ' -f1)" = "$expected_part_06_sha"
          cat .github/bootstrap/migration-overlay.part-* > "$archive"
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$expected_overlay_sha"

          rm -rf /tmp/opening-trainer-workflow-pack
          mkdir -p /tmp/opening-trainer-workflow-pack
          tar -xJf "$archive" -C /tmp/opening-trainer-workflow-pack
          pack_root='/tmp/opening-trainer-workflow-pack'
          test -f "$pack_root/WORKFLOW_MIGRATION.md"

          preserve_before="$(mktemp)"
          preserve_after="$(mktemp)"
          {
            printf '%s\n' \
              '.github/workflows/ci.yml' \
              'package.json' \
              'pnpm-lock.yaml' \
              'pnpm-workspace.yaml' \
              'vite.config.ts' \
              'eslint.config.js' \
              'prettier.config.mjs' \
              'index.html' \
              'tsconfig.app.json' \
              'tsconfig.json' \
              'tsconfig.node.json' \
              'docs/architecture/PHASE-0-BOUNDARIES.md' \
              'docs/dependencies/INSTALLED_DEPENDENCIES.md' \
              'docs/ui/PHASE-0-REUSE-INVENTORY.md' \
              'scripts/check-pwa.mjs' \
              'scripts/update-integrity-manifest.mjs' \
              'scripts/write-dependency-record.mjs'
            find src -type f -print
          } | sort | xargs sha256sum > "$preserve_before"

          while IFS= read -r relative; do
            install -D -m 0644 "$pack_root/$relative" "$relative"
          done <<'REPLACE_PATHS'
          AGENTS.md
          context.md
          plans.md
          README.md
          START_DEVELOPMENT.md
          .github/pull_request_template.md
          docs/product/PRODUCT_CONTRACT.md
          docs/testing/TEST_AND_ACCEPTANCE_STRATEGY.md
          docs/ui/UI_AND_INTERACTION_CONTRACT.md
          docs/decisions/DECISIONS.md
          docs/dependencies/VERIFIED_CANDIDATES_2026-08-03.md
          prompts/README.md
          scripts/verify-pack.mjs
          PACK_MANIFEST.md
          CHATGPT_START_HERE.md
          CHATGPT_WORKFLOW_PROFILE.md
          WORKFLOW_MIGRATION.md
          docs/workflow/CHATGPT_GITHUB_ACTIONS_CODING.md
          docs/workflow/PHASE_COMMANDS.md
          docs/workflow/PROMPT_WRITING_GUIDELINES.md
          docs/workflow/STRUCTURED_REPORT_TEMPLATE.md
          docs/workflow/ACTIONS_SECURITY_AND_EVIDENCE.md
          prompts/WRK-OPENING-TRAINER-20260804-001__MVP__GOVERNANCE__migration__v1.md
          REPLACE_PATHS

          while IFS= read -r relative; do
            rm -f "$relative"
          done <<'DELETE_PATHS'
          CODEX_START_HERE.md
          CODEX_PROMPT_PROFILE.md
          docs/codex/COMPLETION_REPORT_TEMPLATE.md
          docs/codex/PHASE_COMMANDS.md
          docs/codex/PROMPT_WRITING_GUIDELINES.md
          prompts/PRM-OPENING-TRAINER-20260803-001__MVP__PHASE-0__implementation__v1.md
          DELETE_PATHS
          rmdir docs/codex 2>/dev/null || true

          rm -f \
            .github/workflows/workflow-migration-bootstrap.yml \
            .github/bootstrap/migration-overlay.part-00 \
            .github/bootstrap/migration-overlay.part-01 \
            .github/bootstrap/migration-overlay.part-02 \
            .github/bootstrap/migration-overlay.part-03 \
            .github/bootstrap/migration-overlay.part-04 \
            .github/bootstrap/migration-overlay.part-05 \
            .github/bootstrap/migration-overlay.part-06
          rmdir .github/bootstrap 2>/dev/null || true

          {
            printf '%s\n' \
              '.github/workflows/ci.yml' \
              'package.json' \
              'pnpm-lock.yaml' \
              'pnpm-workspace.yaml' \
              'vite.config.ts' \
              'eslint.config.js' \
              'prettier.config.mjs' \
              'index.html' \
              'tsconfig.app.json' \
              'tsconfig.json' \
              'tsconfig.node.json' \
              'docs/architecture/PHASE-0-BOUNDARIES.md' \
              'docs/dependencies/INSTALLED_DEPENDENCIES.md' \
              'docs/ui/PHASE-0-REUSE-INVENTORY.md' \
              'scripts/check-pwa.mjs' \
              'scripts/update-integrity-manifest.mjs' \
              'scripts/write-dependency-record.mjs'
            find src -type f -print
          } | sort | xargs sha256sum > "$preserve_after"
          diff -u "$preserve_before" "$preserve_after"

          node scripts/update-integrity-manifest.mjs

          package_manager="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).packageManager")"
          npm install --global "$package_manager"
          pnpm install --frozen-lockfile
          pnpm validate
          git diff --check "$expected_parent" --

          expected_paths="$(mktemp)"
          actual_paths="$(mktemp)"
          cat > "$expected_paths" <<'EXPECTED_PATHS'
          .github/pull_request_template.md
          AGENTS.md
          CHATGPT_START_HERE.md
          CHATGPT_WORKFLOW_PROFILE.md
          CODEX_PROMPT_PROFILE.md
          CODEX_START_HERE.md
          PACK_MANIFEST.md
          README.md
          SHA256SUMS.txt
          START_DEVELOPMENT.md
          WORKFLOW_MIGRATION.md
          context.md
          docs/codex/COMPLETION_REPORT_TEMPLATE.md
          docs/codex/PHASE_COMMANDS.md
          docs/codex/PROMPT_WRITING_GUIDELINES.md
          docs/decisions/DECISIONS.md
          docs/dependencies/VERIFIED_CANDIDATES_2026-08-03.md
          docs/product/PRODUCT_CONTRACT.md
          docs/testing/TEST_AND_ACCEPTANCE_STRATEGY.md
          docs/ui/UI_AND_INTERACTION_CONTRACT.md
          docs/workflow/ACTIONS_SECURITY_AND_EVIDENCE.md
          docs/workflow/CHATGPT_GITHUB_ACTIONS_CODING.md
          docs/workflow/PHASE_COMMANDS.md
          docs/workflow/PROMPT_WRITING_GUIDELINES.md
          docs/workflow/STRUCTURED_REPORT_TEMPLATE.md
          plans.md
          prompts/PRM-OPENING-TRAINER-20260803-001__MVP__PHASE-0__implementation__v1.md
          prompts/README.md
          prompts/WRK-OPENING-TRAINER-20260804-001__MVP__GOVERNANCE__migration__v1.md
          scripts/verify-pack.mjs
          EXPECTED_PATHS
          sort -o "$expected_paths" "$expected_paths"
          git diff --name-only "$expected_parent" -- | sort > "$actual_paths"
          diff -u "$expected_paths" "$actual_paths"
          test "$(wc -l < "$actual_paths" | tr -d ' ')" = '30'

          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Migrate workflow authority to ChatGPT and Actions'
          final_sha="$(git rev-parse HEAD)"
          final_tree="$(git rev-parse HEAD^{tree})"
          git push origin HEAD:phase-0-foundation

          {
            echo '## Opening Trainer workflow migration'
            echo
            echo "- bootstrap SHA: $GITHUB_SHA"
            echo "- expected parent: $expected_parent"
            echo "- validated final SHA: $final_sha"
            echo "- validated final tree: $final_tree"
            echo '- changed files: 30'
            echo '- dependencies and application code: unchanged'
            echo '- result: COMPLETE_FOR_MANUAL_REVIEW pending permanent CI and Luca acceptance'
          } >> "$GITHUB_STEP_SUMMARY"
